name: Daily Ulke Baskent Short

on:
  schedule:
    - cron: "30 9 * * *"   # 12:30 Turkey time (UTC+3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate, render and upload today's short
        working-directory: src
        env:
          CONTENT_PROFILE: ulke_baskent
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.ULKEBASKENT_YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.ULKEBASKENT_YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.ULKEBASKENT_YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Commit updated question history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history_ulke_baskent.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: log today's Ulke Baskent question"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
