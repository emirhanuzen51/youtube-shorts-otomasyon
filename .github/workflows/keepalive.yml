name: Keepalive Workflow

on:
  schedule:
    # Her Çarşamba ve Pazar gece 00:00 UTC'de çalışır
    - cron: "0 0 * * 0,3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    name: Prevent GitHub Inactivity Workflow Suspension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive step
        uses: gautamkrishnar/keepalive-workflow@v2
