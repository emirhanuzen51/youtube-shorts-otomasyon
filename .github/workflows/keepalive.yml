name: Keepalive Workflow

on:
  schedule:
    # Her Çarşamba ve Pazar gece 00:00 UTC'de çalışır
    - cron: "0 0 * * 0,3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    name: Prevent GitHub Inactivity Workflow Suspension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Keep repository active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u > .github/keepalive.txt
          git add .github/keepalive.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: keepalive ping [skip ci]" || exit 0
          git push
