name: Daily Minik Maceralar Short (Akşam)

on:
  # schedule:
  #   - cron: "0 18 * * *"   # 21:00 Turkey time (UTC+3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install SpeechRecognition pynacl google-genai

      - name: Run Minik Maceralar prerendered uploader
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIKMACERALAR_YT_CLIENT_ID: ${{ secrets.MINIKMACERALAR_YT_CLIENT_ID }}
          MINIKMACERALAR_YT_CLIENT_SECRET: ${{ secrets.MINIKMACERALAR_YT_CLIENT_SECRET }}
          MINIKMACERALAR_YT_REFRESH_TOKEN: ${{ secrets.MINIKMACERALAR_YT_REFRESH_TOKEN }}
        run: |
          python src/upload_prerendered.py minik_maceralar && exit 0
          echo "First attempt failed - waiting 5 minutes before retrying once..."
          sleep 300
          python src/upload_prerendered.py minik_maceralar

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history_minik_maceralar.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: log today's Minik Maceralar short"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            sleep 5
          done
          exit 1
